# Continuous integration.
#
#   Every push and pull request:  linux, linux-package, windows-core, windows-gtk, installer
#   Manual only (Actions > CI > Run workflow):  windows-installer-run

name: CI

on:
  push:
  pull_request:
  # The manual run starts only the job marked "Manual only" below.
  workflow_dispatch:

jobs:
  # The whole test suite on Linux, GUI tests included (GTK runs under a virtual display). The runner has PowerShell
  # 7, so the tests that run the Windows scripts' functions run here too.
  linux:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb adwaita-icon-theme librsvg2-common
      - name: Python environment
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install pytest trafilatura httpx playwright
          .venv/bin/pip install --no-deps -e .
      - run: GSK_RENDERER=cairo xvfb-run -a .venv/bin/pytest -q

  # The Linux package the way a user gets it: build the .deb, install it (its install script creates the private
  # environment and downloads Chromium), then scrape a page that only has its content after JavaScript runs, with
  # nothing configured - the program has to find the Chromium that the package put beside its environment.
  linux-package:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the .deb
        run: ./packaging/build.sh
      - name: Install it
        run: sudo apt-get install -y ./packaging/dist/karamws_*_amd64.deb
      - name: The environment and the browser are where the program looks for them
        run: |
          karamws --version
          test -x /opt/karamws/venv/bin/python3
          ls /opt/karamws/browsers
          ls /opt/karamws/browsers | grep -q '^chromium_headless_shell-'
      - name: Scrape a JavaScript page with the installed program
        run: |
          mkdir -p /tmp/site/2026/js-post
          cat > /tmp/site/2026/js-post/index.html << 'PAGE'
          <html><head><title>A page made by JavaScript</title></head><body><div id="app"></div>
          <script>
            const text = 'This paragraph exists only after JavaScript has run in a real browser. '.repeat(8);
            document.getElementById('app').innerHTML = '<article><h1>A page made by JavaScript</h1><p>' + text + '</p></article>';
          </script></body></html>
          PAGE
          (cd /tmp/site && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          env -u PLAYWRIGHT_BROWSERS_PATH karamws http://127.0.0.1:8765/2026/js-post/ --kind article \
              --delay 0 -o /tmp/out
          grep -rq 'only after JavaScript has run' /tmp/out
      - name: Remove it again (the install folder goes away entirely)
        run: |
          sudo apt-get remove -y karamws
          test ! -e /opt/karamws
      - uses: actions/upload-artifact@v4
        with:
          name: karamws-deb
          path: packaging/dist/*.deb

  # The engine, storage, paths and the Windows support code, without GTK: catches path, encoding and file-locking
  # mistakes on a real Windows file system. The GUI tests skip themselves here.
  windows-core:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest trafilatura httpx playwright
      - run: pip install --no-deps -e .
      - run: pytest -q

  # The real thing: installs the GTK runtime with scripts/install-windows.ps1 (no Chromium) and runs the whole suite,
  # GUI tests included, against GTK 4 and libadwaita on Windows. The Python version has to be the one the gvsbuild
  # PyGObject wheel was built for. The install script takes the release named in scripts/gtk-portable.ps1 (2026.8.0:
  # wheels for 3.14), not the newest one: gvsbuild 2026.10.0 builds its wheels for Python 3.15. When you move to a
  # newer release, change that tag and this Python version together; if this job fails with "are for Python x.y",
  # that is the mismatch.
  windows-gtk:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install GTK and the Python environment
        shell: pwsh
        run: ./scripts/install-windows.ps1 -SkipBrowser -NoShortcut -PythonVersion ${{ matrix.python }}
      - name: Test
        shell: pwsh
        run: |
          .venv\Scripts\python.exe -m pip install pytest
          .venv\Scripts\python.exe -m pytest -q

  # Builds the Windows installer and checks what went into it: the GTK runtime, the Python installer, the Python
  # libraries (the wheelhouse) and Chromium. The installer is kept as a build artifact. It waits for the cheaper
  # windows-core job, so a broken Windows code base does not cost a build.
  installer:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    needs: windows-core
    steps:
      - uses: actions/checkout@v4
      # The Python libraries inside the installer are collected with the Python of the GTK runtime.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build the installer (GTK, the Python installer, the Python libraries, Chromium and the Visual C++ DLLs go inside)
        shell: pwsh
        env:
          # Lifts the API rate limit for the digest lookup of the GTK zip.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./packaging/build-windows.ps1 -RequirePython -RequireBrowsers -RequireVcRuntime
      - name: The installer carries the GTK runtime
        shell: pwsh
        run: |
          . ./scripts/gtk-portable.ps1
          if (-not (Test-GtkRuntime 'packaging\gtk')) { throw 'The GTK runtime was not prepared.' }
          Get-Content packaging\gtk\gvsbuild-release.txt
          if (-not (Get-ChildItem packaging\gtk\wheels -Filter 'pygobject*.whl')) {
              throw 'The runtime has no PyGObject wheel.'
          }
          $size = (Get-ChildItem packaging\gtk -Recurse -File | Measure-Object Length -Sum).Sum
          "GTK runtime: {0:N0} MB unpacked" -f ($size / 1MB)
          $setup = Get-ChildItem packaging\dist\*.exe | Select-Object -First 1
          "{0}: {1:N1} MB" -f $setup.Name, ($setup.Length / 1MB)
          if ($setup.Length -lt $size / 8) { throw 'The installer is too small to contain the GTK runtime.' }
      - name: The installer carries the Python installer and the Python libraries
        shell: pwsh
        run: |
          . ./scripts/python-bundle.ps1
          $minor = Get-GtkPythonMinor 'packaging\gtk'
          "Python of the GTK runtime: $minor"
          $pythonSetup = Find-PythonInstaller 'packaging\python' $minor
          if (-not $pythonSetup) { throw "The Python $minor installer was not prepared (packaging\python)." }
          "{0}: {1:N1} MB" -f (Split-Path $pythonSetup -Leaf), ((Get-Item $pythonSetup).Length / 1MB)
          if (-not (Test-Wheelhouse 'packaging\wheelhouse' $minor)) {
              throw 'The Python libraries were not prepared (packaging\wheelhouse).'
          }
          $wheels = @(Get-ChildItem packaging\wheelhouse -Filter '*.whl')
          $size = ($wheels | Measure-Object Length -Sum).Sum
          "{0} wheels, {1:N0} MB" -f $wheels.Count, ($size / 1MB)
          $setup = Get-ChildItem packaging\dist\*.exe | Select-Object -First 1
          "{0}: {1:N1} MB" -f $setup.Name, ($setup.Length / 1MB)
          if ($setup.Length -lt $size / 8) { throw 'The installer is too small to contain the Python libraries.' }
      - name: The installer carries Chromium
        shell: pwsh
        run: |
          . ./scripts/browsers-portable.ps1
          if (-not (Test-BrowsersFolder 'packaging\browsers')) { throw 'Chromium was not prepared (packaging\browsers).' }
          Get-ChildItem packaging\browsers -Directory | ForEach-Object { $_.Name }
          $size = (Get-ChildItem packaging\browsers -Recurse -File | Measure-Object Length -Sum).Sum
          "Chromium: {0:N0} MB unpacked" -f ($size / 1MB)
          $setup = Get-ChildItem packaging\dist\*.exe | Select-Object -First 1
          if ($setup.Length -lt $size / 8) { throw 'The installer is too small to contain Chromium.' }
      - uses: actions/upload-artifact@v4
        with:
          name: karamws-windows-setup
          path: packaging/dist/*.exe

  # Manual only. Builds the installer and runs it the way a user would (silently), then checks that GTK came from
  # inside the installer (nothing is downloaded into %LOCALAPPDATA%\karamws\gtk), that GTK loads, that the program
  # finds the Chromium of the installation and renders a JavaScript page with it, and that the application stays up;
  # and that running the installer again over the first installation (an upgrade) keeps the user's data and leaves
  # a working program.
  windows-installer-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: pwsh
        run: ./packaging/build-windows.ps1 -RequirePython -RequireBrowsers -RequireVcRuntime
      - name: Run the installer (silently, as a user would, on a machine whose Python is not there for it to use)
        shell: pwsh
        timeout-minutes: 35
        run: |
          # The runner's Python (setup-python, above) was only needed to build the installer. Taking it off the PATH
          # and out of the registry (where the py launcher looks) leaves the Python installer inside setup.exe as the
          # only way to get Python 3.14, which is what a user without Python has.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and $_ -notlike '*hostedtoolcache*Python*' }) -join ';'
          $registryKeys = 'HKLM:\SOFTWARE\Python\PythonCore\3.14',
                          'HKLM:\SOFTWARE\WOW6432Node\Python\PythonCore\3.14',
                          'HKCU:\SOFTWARE\Python\PythonCore\3.14'
          foreach ($key in $registryKeys) {
            if (Test-Path $key) { "Removing $key"; Remove-Item $key -Recurse -Force }
          }
          $left = Get-Command python -ErrorAction SilentlyContinue
          if ($left) { "Still on the PATH: $($left.Source)" } else { 'No Python on the PATH.' }
          if (Get-Command py -ErrorAction SilentlyContinue) {
            'The py launcher knows:'
            & py -0p 2>&1 | Out-Host
            $global:LASTEXITCODE = 0
          }
          ./packaging/windows/run-installer.ps1 -Label first
      - name: Check the installation (Python, its libraries and Chromium came from inside the installer)
        shell: pwsh
        run: ./packaging/windows/check-installed.ps1 -ExpectBundledPython
      - name: Put something of the user's where an upgrade must not touch it
        shell: pwsh
        run: |
          $data = Join-Path $env:LOCALAPPDATA 'karamws'
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content (Join-Path $data 'keep-me.txt') 'the user''s data'
      - name: Run the installer again over the first installation (an upgrade)
        shell: pwsh
        timeout-minutes: 35
        run: ./packaging/windows/run-installer.ps1 -Label second
      - name: Check the upgraded installation
        shell: pwsh
        run: |
          $keepMe = Join-Path $env:LOCALAPPDATA 'karamws\keep-me.txt'
          if (-not (Test-Path $keepMe)) { throw "The upgrade removed the user's data." }
          # Same Python, so the Python environment of the first installation is reused, not made again.
          $log = Get-Content (Join-Path $env:LOCALAPPDATA 'karamws\install.log') -Raw
          if ($log -match 'recreating it') {
              throw 'The upgrade recreated the Python environment although Python had not changed.'
          }
          ./packaging/windows/check-installed.ps1
      # This runner has the Visual C++ Redistributable, so the program starting here proves nothing about a machine
      # that lacks it. Two steps cover that. Both run on the upgraded installation, and even when an earlier step
      # failed, so that the rest of the job still reports.
      #   - The first reads the import tables of every program file and fails when a DLL that the program needs is
      #     provided by nothing in the installation (msvcp140.dll ... would come from the vcruntime folder the
      #     installer carries).
      #   - The second imports the libraries the way the program does and fails when a Visual C++ runtime DLL was
      #     loaded from the machine instead of from the installation.
      - name: Which DLLs does the installed program need from the machine? (import tables)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'Programs\KaramWS'
          & "$app\.venv\Scripts\python.exe" -I packaging\windows\dlls.py scan --app $app --strict `
              --json "$env:RUNNER_TEMP\dll-scan.json" --github
          if ($LASTEXITCODE -ne 0) {
              throw ("Something the installed program needs is provided by nothing in the installation, or the " +
                     "scan failed (exit code $LASTEXITCODE); the list is above.")
          }
      - name: Where do the Visual C++ runtime DLLs of the running program come from?
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'Programs\KaramWS'
          & "$app\.venv\Scripts\python.exe" packaging\windows\dlls.py loaded --app $app --strict
          if ($LASTEXITCODE -ne 0) {
              throw ("A library failed to import or a Visual C++ runtime DLL came from the machine instead of the " +
                     "installation (exit code $LASTEXITCODE); the list is above.")
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dll-scan
          path: ${{ runner.temp }}/dll-scan.json
          if-no-files-found: ignore
